  <text x="0" y="40" fill="#CCCCCC" xml:space="preserve"><tspan fill="#F9F1A5">&gt;&gt;&gt;</tspan> <tspan fill="#C586C0">from</tspan> cleavedb_client <tspan fill="#C586C0">import</tspan> <tspan fill="#DCDCAA">CleaveDB</tspan></text>
