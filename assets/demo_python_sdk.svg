  <text x="0" y="120" fill="#CCCCCC" xml:space="preserve"><tspan fill="#F9F1A5">&gt;&gt;&gt;</tspan> result = db.<tspan fill="#DCDCAA">query</tspan>(&quot;&quot;&quot;</text>
