    <text x="20" y="190" fill="#888">Found 3 document(s).</text>
    <text x="20" y="210" fill="#56B6C2">- users:alice {"name": "Alice"}</text>
    <text x="20" y="230" fill="#56B6C2">- users:bob {"name": "Bob"}</text>
    <text x="20" y="250" fill="#56B6C2">- users:charlie {"name": "Charlie"}</text>

    <!-- Drift Detection -->
    <text x="20" y="290" fill="#00FF00">cleave&gt;</text>
    <text x="85" y="290" fill="#FFF"><tspan fill="#C678DD">FIND HOW THE</tspan> "friend" <tspan fill="#C678DD">OF</tspan> "users:alice" <tspan fill="#C678DD">CHANGED BETWEEN</tspan> "yesterday" <tspan fill="#C678DD">AND</tspan> "now"</text>
    
    <text x="20" y="325" fill="#98C379">[+] LINK</text><text x="100" y="325" fill="#FFF">"users:alice" -> "users:bob" @friend (12:05 PM)</text>
    <text x="20" y="345" fill="#E06C75">[-] SEVER</text><text x="100" y="345" fill="#FFF">"users:alice" -> "users:bob" @friend (02:30 PM)</text>
  </g>
</svg>
