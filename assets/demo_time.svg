<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="100%" height="100%" fill="#1E1E1E" rx="10"/>
  
  <circle cx="20" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="20" r="6" fill="#27C93F"/>
  <text x="350" y="24" fill="#888" font-family="monospace" font-size="14">cleave_shell</text>

  <g font-family="Consolas, monospace" font-size="14">
    <!-- Current Graph -->
    <text x="20" y="60" fill="#00FF00">cleave&gt;</text>
    <text x="85" y="60" fill="#FFF">FOLLOW "users:alice" THROUGH "friend" DEPTH 2</text>
    <text x="20" y="85" fill="#888">Found 1 document(s).</text>
    <text x="20" y="105" fill="#56B6C2">- users:alice {"name": "Alice"}</text>

    <!-- Past Graph (4D Traversal) -->
    <text x="20" y="145" fill="#00FF00">cleave&gt;</text>
    <text x="85" y="145" fill="#FFF">FOLLOW "users:alice" THROUGH "friend" <tspan fill="#E5C07B">AS OF "yesterday"</tspan> DEPTH 2</text>
